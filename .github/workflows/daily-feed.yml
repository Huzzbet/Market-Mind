name: Market Mind Daily Feed

on:
  push:
    paths:
      - "scripts/update_feed.py"
      - ".github/workflows/daily-feed.yml"
  schedule:
    # 8:00am Melbourne/Sydney during AEDT (7:00am during AEST)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update daily feed
        run: python scripts/update_feed.py

      - name: Validate feed
        run: python -c 'import json; d=json.load(open("data/feed.json")); c=d.get("cards",[]); assert isinstance(c,list) and len(c)>=5, "feed has fewer than 5 cards"; assert d.get("updatedAt"), "missing updatedAt"; assert all(all(x.get(k) for k in ("tag","title","dek","data","insight","source")) for x in c), "card missing required field"; print("Validated %d cards" % len(c))'

      - name: Commit feed
        run: |
          git config user.name "market-mind-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet && echo "No feed changes to commit" && exit 0
          git commit -m "Refresh Market Mind daily feed"
          git push
