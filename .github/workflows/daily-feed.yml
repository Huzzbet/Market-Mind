name: Market Mind Daily Feed

on:
  push:
    paths:
      - "scripts/update_feed.py"
      - "scripts/generate_ai_report.py"
      - ".github/workflows/daily-feed.yml"
  schedule:
    # Weekday morning refresh in Melbourne time: 7am during daylight saving.
    # GitHub cron uses UTC; Melbourne shifts seasonally, so this is 7am AEDT / 6am AEST.
    - cron: "0 20 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-mind-feed
  cancel-in-progress: true

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update market data and news
        run: python scripts/update_feed.py

      - name: Generate ChatGPT daily report cards
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: python scripts/generate_ai_report.py

      - name: Validate feed freshness and evidence
        run: python scripts/validate_feed.py

      - name: Commit feed
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "market-mind-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet && echo "No feed changes to commit" && exit 0
          git commit -m "Refresh Market Mind daily feed"
          git pull --rebase origin main
          git push
