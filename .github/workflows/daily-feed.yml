name: Market Mind Daily Feed

on:
  push:
    paths:
      - "scripts/update_feed.py"
      - ".github/workflows/daily-feed.yml"
  schedule:
    # 8:00am Melbourne/Sydney during AEDT (7:00am during AEST)
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update daily feed
        run: python scripts/update_feed.py

      - name: Validate feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/feed.json")
          data = json.loads(p.read_text())
          cards = data.get("cards", [])
          if not isinstance(cards, list) or len(cards) < 5:
              raise SystemExit("Refusing to publish: feed has fewer than 5 cards")
          if not data.get("updatedAt"):
              raise SystemExit("Refusing to publish: missing updatedAt")
          for i, card in enumerate(cards):
              for key in ("tag", "title", "dek", "data", "insight", "source"):
                  if not card.get(key):
                      raise SystemExit(f"Refusing to publish: card {i} missing {key}")
          print(f"Validated {len(cards)} cards")

      - name: Commit feed
        run: |
          git config user.name "market-mind-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet && echo "No feed changes to commit" && exit 0
          git commit -m "Refresh Market Mind daily feed"
          git push
