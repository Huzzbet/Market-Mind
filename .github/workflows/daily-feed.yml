name: Market Mind Daily Feed

on:
  push:
    paths:
      - "scripts/update_feed.py"
      - ".github/workflows/daily-feed.yml"
  schedule:
    # Refresh the company/news feed every 6 hours (UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-mind-feed
  cancel-in-progress: true

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update daily feed
        run: python scripts/update_feed.py

      - name: Validate feed freshness and evidence
        run: python scripts/validate_feed.py

      - name: Commit feed
        run: |
          git config user.name "market-mind-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet && echo "No feed changes to commit" && exit 0
          git commit -m "Refresh Market Mind daily feed"
          git pull --rebase origin main
          git push
