<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Mind — Market Intelligence</title>
<style>
:root{--bg:#05080d;--panel:#0a0f16;--line:#1b2531;--muted:#7f8b99;--text:#f3f6f8;--accent:#ffb000;--up:#26d07c;--down:#ff5b67}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 10%,#111923 0,#05080d 48%)}
header{height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:3;background:rgba(5,8,13,.92);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px}.mark{width:29px;height:29px;border:2px solid var(--accent);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--accent);transform:skew(-8deg)}.logo{font-size:20px;font-weight:850;letter-spacing:-.7px}.logo span{color:var(--muted);font-weight:500}
.marketbar{display:flex;gap:14px;align-items:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.ticker b{color:var(--text);font-size:11px}.up{color:var(--up)!important}.down{color:var(--down)!important}
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}.card{position:relative;min-height:100%;scroll-snap-align:start;padding:28px 22px 42px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.card:after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;position:relative;z-index:1}.tag{font-size:10px;font-weight:850;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase}.timestamp{font-size:10px;color:var(--muted)}
h1{font-size:clamp(36px,8vw,68px);line-height:.94;letter-spacing:-3px;max-width:850px;margin:0 0 20px;position:relative;z-index:1}.dek{font-size:17px;line-height:1.48;color:#b7c0ca;max-width:690px;margin:0;position:relative;z-index:1}
.data{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:28px 0;max-width:620px;position:relative;z-index:1}.box{background:rgba(10,15,22,.88);border:1px solid var(--line);padding:13px 14px}.label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.value{font-size:21px;font-weight:750;margin-top:4px}.change{font-size:11px;margin-left:5px}
.insight{border-left:2px solid var(--accent);padding:10px 0 10px 14px;max-width:680px;position:relative;z-index:1}.insight small{display:block;color:var(--accent);font-size:9px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}.insight p{margin:0;font-size:14px;line-height:1.45;color:#d5dbe2}
.source{position:absolute;bottom:18px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:9px;color:#667382;z-index:2}.actions{position:absolute;right:14px;bottom:55px;display:flex;flex-direction:column;gap:10px;z-index:3}.action{width:39px;height:39px;border:1px solid #293542;background:rgba(8,12,18,.8);color:#b8c2cc;border-radius:50%;display:grid;place-items:center;font-size:15px}.action:hover{border-color:var(--accent);color:var(--accent)}
.progress{position:absolute;right:7px;top:82px;bottom:82px;width:2px;background:#18212c;z-index:4}.progress i{display:block;width:100%;background:var(--accent);height:25%}
nav{height:62px;flex:0 0 62px;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;background:rgba(5,8,13,.96);z-index:5}.navitem{text-align:center;color:#647181;font-size:9px;text-transform:uppercase;letter-spacing:.8px}.navitem b{display:block;color:#f3f6f8;font-size:16px;margin-bottom:2px}.navitem.active{color:var(--accent)}
@media(min-width:800px){.app{max-width:1000px;margin:auto;border-left:1px solid #111923;border-right:1px solid #111923}.card{padding-left:58px;padding-right:58px}.source{left:58px;right:58px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="mark">M</div><div class="logo">Market<span>Mind</span></div></div><div class="marketbar"><div class="ticker">ASX 200 <b id="asx">—</b></div><div class="ticker">S&P 500 <b id="spx">—</b></div><div class="ticker">VIX <b id="vix">—</b></div></div></header>
<main class="feed" id="feed"></main>
<div class="progress"><i id="progress"></i></div>
<nav><div class="navitem active"><b>◉</b>Feed</div><div class="navitem"><b>⌁</b>Markets</div><div class="navitem"><b>☆</b>Watchlist</div><div class="navitem"><b>≡</b>More</div></nav>
</div>
<script>
const feed=document.getElementById("feed");
const marketNames={"^AXJO":["ASX 200","Australian equities"],"^GSPC":["S&P 500","US equities"],"^VIX":["VIX","US volatility"],"CL=F":["WTI Crude","Oil"],"GC=F":["Gold","Precious metals"],"AUDUSD=X":["AUD/USD","Australian dollar"],"^TNX":["US 10Y","Rates"]};
const fallbackCards=[
{tag:"MACRO / RATES",time:"DEMO",title:"Why bond yields matter",dek:"A move in government yields can reprice almost every asset class. The important question is not simply where yields are — it is what changed to make them move.",data:[["10Y UST","Yield"],["RBA","Policy"],["ASSET CLASS","Rates"]],insight:"Higher discount rates generally matter most for assets whose value depends heavily on cash flows far into the future."},
{tag:"PORTFOLIO / RISK",time:"DEMO",title:"Ten stocks don't guarantee diversification",dek:"A portfolio can contain many securities and still be exposed to one dominant economic driver.",data:[["EQUITIES","Exposure"],["RATES","Driver"],["FX","Driver"]],insight:"Look through the names and identify the underlying drivers: rates, growth, inflation, commodities, currency and liquidity."}
];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pct(v){return Number.isFinite(v)?(v>=0?"+":"")+v.toFixed(2)+"%":"—";}
function price(v){return Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:2}):"—";}
function direction(v){return v>=0?"up":"down";}
function scoreMarket(x,all){
 var move=Math.abs(x.pct||0),score=Math.min(60,move*12);
 if(x.symbol==="^VIX") score+=Math.min(20,move*8);
 if(["^AXJO","^GSPC"].indexOf(x.symbol)>=0 && all.some(function(y){return y.symbol==="^VIX"&&y.ok&&y.pct>1;})) score+=10;
 if(["CL=F","GC=F","AUDUSD=X","^TNX"].indexOf(x.symbol)>=0) score+=5;
 return Math.min(100,Math.round(score));
}
function crossAssetSignals(all){
 var get=function(s){return all.find(function(x){return x.symbol===s&&x.ok&&Number.isFinite(x.pct);});};
 var oil=get("CL=F"),aud=get("AUDUSD=X"),eq=get("^GSPC"),vix=get("^VIX"),rates=get("^TNX"),gold=get("GC=F");
 var signals=[];
 if(oil&&aud&&oil.pct>0.8&&aud.pct< -0.4) signals.push({score:88,title:"Oil higher while the Australian dollar falls",body:"Energy is moving higher while AUD/USD is moving lower. That combination can point to a broader risk or macro repricing rather than a simple commodity move."});
 if(eq&&vix&&eq.pct< -0.7&&vix.pct>2) signals.push({score:94,title:"Equities lower as volatility rises",body:"US equities are falling while the VIX is rising. The combination is a stronger risk signal than either move viewed alone."});
 if(rates&&eq&&rates.pct>0.8&&eq.pct< -0.5) signals.push({score:86,title:"Yields higher as equities weaken",body:"Treasury yields are moving higher while equities are falling. Rates may be an important part of the market repricing, although the cause requires news context."});
 if(gold&&rates&&gold.pct>0.8&&rates.pct>0.8) signals.push({score:72,title:"Gold and yields are rising together",body:"Gold and Treasury yields are both moving higher. That is worth watching because the usual relationship can be complicated by inflation, currency and safe-haven flows."});
 return signals.sort(function(a,b){return b.score-a.score;});
}
function crossAssetCard(signal){
 return {tag:"CROSS-ASSET / SIGNAL",time:"SIGNAL • "+signal.score+"/100",title:signal.title,dek:signal.body,data:[["IMPORTANCE",signal.score+"/100"],["SIGNAL","Cross-asset"],["STATUS","Detected"]],insight:"Market Mind detected multiple related moves occurring together. Treat this as a signal for investigation, not a standalone explanation.",source:"Market Mind • Derived signal",rank:signal.score};
}
function marketCard(x,index,all){
 const meta=marketNames[x.symbol]||[x.symbol,x.symbol],name=meta[0],asset=meta[1],dir=x.pct>=0?"higher":"lower";
 let title,dek,mind;
 if(x.symbol==="^VIX"){title="Volatility is "+dir;dek="The VIX is "+price(x.price)+", "+pct(x.pct)+" on the session. It tracks expected US equity volatility and is useful as a risk-sentiment gauge.";mind=x.pct>=0?"A rising volatility gauge can signal increasing demand for protection or uncertainty; the move is most useful when confirmed by equity and rates markets.":"A falling volatility gauge can indicate calmer near-term expectations, but low volatility does not remove underlying portfolio risk.";}
 else if(x.symbol==="CL=F"){title="Oil is "+dir;dek="WTI crude is "+price(x.price)+", "+pct(x.pct)+" today. Energy prices can feed into inflation, transport costs and company margins.";mind=x.pct>=0?"Higher oil prices can matter beyond energy producers because fuel and input costs flow into inflation expectations and margins.":"Lower oil can ease input-cost pressure, although the impact differs across producers, consumers and energy-intensive businesses.";}
 else if(x.symbol==="GC=F"){title="Gold is "+dir;dek="Gold is "+price(x.price)+", "+pct(x.pct)+" today. The metal is often watched alongside real yields, the US dollar and risk sentiment.";mind="The useful signal is the combination: gold, real yields and the US dollar can help distinguish a rates story from a broader risk or currency move.";}
 else if(x.symbol==="AUDUSD=X"){title="The Australian dollar is "+dir;dek="AUD/USD is "+price(x.price)+", "+pct(x.pct)+" today. The currency links Australian assets to global growth, commodities and US dollar conditions.";mind="For Australian portfolios, currency can change the return experienced on unhedged international assets even when the underlying asset price is unchanged.";}
 else {title=name+" is "+dir;dek=name+" is "+price(x.price)+", "+pct(x.pct)+" on the session. The move provides a live read on "+asset.toLowerCase()+" conditions.";mind=x.pct>=0?"The key question is whether the move is broad-based or concentrated. Compare it with volatility, rates, commodities and news before treating it as a regime signal.":"A falling market needs context: identify whether the move is driven by rates, growth expectations, sector rotation or a specific headline.";}
 var score=scoreMarket(x,all);
return {tag:"LIVE / "+asset.toUpperCase(),time:"LIVE • "+score+"/100",title:title,dek:dek,data:[[name,price(x.price)],["SESSION",pct(x.pct)],["IMPORTANCE",score+"/100"]],insight:mind,source:"Market Mind • Live market data",rank:score};
}
function newsCard(item){return {tag:"NEWS / MARKET INTELLIGENCE",time:"NEWS",title:item.title,dek:(item.source||"Market source")+" • "+(item.pubDate?new Date(item.pubDate).toLocaleString([], {hour:"2-digit",minute:"2-digit",day:"2-digit",month:"short"}):"Latest"),data:[["SOURCE",item.source||"News"],["TYPE","Market news"],["STATUS","Latest"]],insight:"Read the headline in context: identify which asset, sector, rate or currency is directly exposed and whether the market has already reacted.",source:item.link?"Original article ↗":"Market Mind • News feed",link:item.link,rank:0};}
function renderCards(cards){
 feed.innerHTML=cards.map(function(c,i){return '<article class="card"><div class="topline"><div class="tag">'+esc(c.tag)+'</div><div class="timestamp">'+esc(c.time)+'</div></div><h1>'+esc(c.title)+'</h1><p class="dek">'+esc(c.dek)+'</p><div class="data">'+c.data.map(function(d){return '<div class="box"><div class="label">'+esc(d[0])+'</div><div class="value">'+esc(d[1])+'</div></div>';}).join("")+'</div><div class="insight"><small>The Mind</small><p>'+esc(c.insight)+'</p></div><div class="actions"><button class="action save" aria-label="Save">☆</button><button class="action share" aria-label="Share">↗</button>'+(c.link?'<button class="action open" aria-label="Open source">↗</button>':'<button class="action" aria-label="More">•••</button>')+'</div><div class="source"><span>'+esc(c.source)+'</span><span>'+(i+1)+' / '+cards.length+'</span></div></article>';}).join("");
 feed.querySelectorAll(".save").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();b.textContent=b.textContent==="☆"?"★":"☆";});});
 feed.querySelectorAll(".share").forEach(function(b,i){b.addEventListener("click",function(e){e.stopPropagation();var c=cards[i];if(navigator.share)navigator.share({title:c.title,text:c.dek,url:c.link||location.href});});});
 feed.querySelectorAll(".open").forEach(function(b,i){b.addEventListener("click",function(e){e.stopPropagation();if(cards[i].link)window.open(cards[i].link,"_blank","noopener,noreferrer");});});
 feed.scrollTop=0;
}
function setHealth(text,ok){
 var el=document.getElementById("status");
 if(!el){el=document.createElement("div");el.id="status";el.style.cssText="position:absolute;top:70px;left:18px;z-index:6;font-size:9px;letter-spacing:.7px;text-transform:uppercase;padding:5px 8px;border:1px solid var(--line);background:#081018;color:var(--muted)";document.querySelector(".app").appendChild(el);}
 el.textContent=(ok?"● LIVE ":"○ ")+text;el.style.color=ok?"var(--up)":"var(--down)";
}
async function loadLiveFeed(){
 try{
  var responses=await Promise.all([fetch("/api/market?symbols=%5EAXJO,%5EGSPC,%5EVIX,CL=F,GC=F,AUDUSD=X,%5ETNX"),fetch("/api/news?q=ASX%20Australia%20markets%20OR%20US%20stocks%20OR%20RBA%20OR%20oil")]);
  if(!responses[0].ok)throw new Error("market endpoint "+responses[0].status);
  var market=await responses[0].json(); var map=Object.fromEntries((market.data||[]).map(function(x){return [x.symbol,x];})); ["^AXJO","^GSPC","^VIX"].forEach(function(sym,i){var el=document.getElementById(["asx","spx","vix"][i]),x=map[sym];if(el){el.textContent=x&&x.ok?pct(x.pct):"—";el.className=x&&x.ok?direction(x.pct):"";}}); var raw=(market.data||[]).filter(function(x){return x.ok&&Number.isFinite(x.pct);}); var live=raw.map(function(x,i){return marketCard(x,i,raw);}); var signals=crossAssetSignals(raw); var signalCards=signals.map(crossAssetCard);
  var news=[];
  if(responses[1].ok){var j=await responses[1].json();news=(j.items||[]).slice(0,3).map(newsCard);}
  live.sort(function(a,b){return b.rank-a.rank;});
  var cards=signalCards.concat(live.slice(0,4)).concat(news);
  if(cards.length) cards[0].tag="TOP SIGNAL / "+cards[0].tag.replace("LIVE / ","");
  renderCards(cards.length?cards:fallbackCards);
  setHealth("LIVE • "+live.length+" markets • "+signals.length+" signals • "+news.length+" headlines",true);
 }catch(err){console.warn("Live feed unavailable",err);renderCards(fallbackCards);setHealth("Demo mode • API unavailable",false);}
}
loadLiveFeed();
setInterval(loadLiveFeed,60000);
feed.addEventListener("scroll",function(){var max=feed.scrollHeight-feed.clientHeight;document.getElementById("progress").style.height=Math.max(8,Math.min(100,(feed.scrollTop/max)*75+25))+"%";});
</script>
</body>
</html>
