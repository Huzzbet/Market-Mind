<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Market Mind — Market Intelligence</title>
<style>
:root{--bg:#05080d;--panel:#0a0f16;--line:#1b2531;--muted:#7f8b99;--text:#f3f6f8;--accent:#ffb000;--up:#26d07c;--down:#ff5b67}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 10%,#111923 0,#05080d 48%)}
header{height:64px;flex:0 0 64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:3;background:rgba(5,8,13,.92);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px}.mark{width:29px;height:29px;border:2px solid var(--accent);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--accent);transform:skew(-8deg)}.logo{font-size:20px;font-weight:850;letter-spacing:-.7px}.logo span{color:var(--muted);font-weight:500}
.marketbar{display:flex;gap:14px;align-items:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.ticker b{color:var(--text);font-size:11px}.up{color:var(--up)!important}.down{color:var(--down)!important}
.feed{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}.card{position:relative;min-height:100%;scroll-snap-align:start;padding:28px 22px 42px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.card:after{content:"";position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;position:relative;z-index:1}.tag{font-size:10px;font-weight:850;letter-spacing:1.5px;color:var(--accent);text-transform:uppercase}.timestamp{font-size:10px;color:var(--muted)}
h1{font-size:clamp(36px,8vw,68px);line-height:.94;letter-spacing:-3px;max-width:850px;margin:0 0 20px;position:relative;z-index:1}.dek{font-size:17px;line-height:1.48;color:#b7c0ca;max-width:690px;margin:0;position:relative;z-index:1}
@media(max-width:600px){header{height:64px;flex:0 0 64px;padding:0 18px}.brand{gap:10px;flex:0 0 auto;min-width:0}.mark{width:29px;height:29px;font-size:12px;flex:0 0 29px}.logo{font-size:20px;letter-spacing:-.7px;white-space:nowrap}.marketbar{flex:1;min-width:0;gap:14px;justify-content:flex-end;margin-left:8px}.marketbar .ticker{font-size:10px;letter-spacing:.8px;line-height:1;white-space:nowrap}.marketbar .ticker b{display:inline;font-size:11px;line-height:1;margin-top:0}.card{padding-left:22px;padding-right:64px}h1{font-size:clamp(34px,8vw,52px);letter-spacing:-2.4px}.dek{font-size:16px}.data{margin-top:24px}.insight{max-width:none;padding-right:4px}.mind-reveal.d3{padding-right:0}.actions{right:8px;width:42px}.action{width:39px;height:39px}.source{left:22px;right:22px;padding-right:50px}.ticker{white-space:nowrap}}
.data{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:28px 0;max-width:620px;position:relative;z-index:1}.box{background:rgba(10,15,22,.88);border:1px solid var(--line);padding:13px 14px}.label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.value{font-size:21px;font-weight:750;margin-top:4px}.change{font-size:11px;margin-left:5px}
.insight{border-left:2px solid var(--accent);padding:10px 0 10px 14px;max-width:680px;position:relative;z-index:1}.insight small{display:block;color:var(--accent);font-size:9px;font-weight:850;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}.insight p{margin:0;font-size:14px;line-height:1.45;color:#d5dbe2}
.source{position:absolute;bottom:18px;left:22px;right:22px;display:flex;justify-content:space-between;font-size:9px;color:#667382;z-index:2}.actions{position:absolute;right:14px;bottom:55px;display:flex;flex-direction:column;gap:10px;z-index:3}.action{width:39px;height:39px;border:1px solid #293542;background:rgba(8,12,18,.8);color:#b8c2cc;border-radius:50%;display:grid;place-items:center;font-size:15px}.action:hover{border-color:var(--accent);color:var(--accent)}
.progress{position:absolute;right:7px;top:82px;bottom:82px;width:2px;background:#18212c;z-index:4}.progress i{display:block;width:100%;background:var(--accent);height:25%}
nav{height:62px;flex:0 0 62px;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;background:rgba(5,8,13,.96);z-index:5}.navitem{text-align:center;color:#647181;font-size:9px;text-transform:uppercase;letter-spacing:.8px}.navitem b{display:block;color:#f3f6f8;font-size:16px;margin-bottom:2px}.navitem.active{color:var(--accent)}
@media(min-width:800px){.app{max-width:1000px;margin:auto;border-left:1px solid #111923;border-right:1px solid #111923}.card{padding-left:58px;padding-right:58px}.source{left:58px;right:58px}}
</style>
<style id="mind-motion">.mind-chart{height:92px;margin:22px 0 4px;max-width:680px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,176,0,.035),rgba(0,0,0,.08))}.mind-chart svg{width:100%;height:100%;display:block}.mind-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:drawLine 1.35s ease-out forwards}.mind-grid{stroke:#18212c;stroke-width:1}.mind-dot{fill:var(--accent);animation:pulseDot 1.6s ease-in-out infinite}.signal-pill{display:inline-flex;gap:7px;align-items:center;margin-top:12px;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#aeb8c3}.signal-pill i{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 12px var(--up);animation:livePulse 1.5s infinite}.mind-reveal{opacity:0;transform:translateY(10px);animation:reveal .55s ease-out forwards}.mind-reveal.d1{animation-delay:.15s}.mind-reveal.d2{animation-delay:.3s}.mind-reveal.d3{animation-delay:.45s}@keyframes drawLine{to{stroke-dashoffset:0}}@keyframes reveal{to{opacity:1;transform:none}}@keyframes pulseDot{0%,100%{r:3}50%{r:5}}@keyframes livePulse{50%{opacity:.35;transform:scale(.75}}</style>
</head>
<body>
<div class="app">
<header><div class="brand"><div class="mark">M</div><div class="logo">Market<span>Mind</span></div></div><div class="marketbar"><div class="ticker">ASX 200 <b id="asx">—</b></div><div class="ticker">S&amp;P 500 <b id="spx">—</b></div></div></header>
<main class="feed" id="feed"></main>
<div class="progress"><i id="progress"></i></div>
<nav><div class="navitem active"><b>◉</b>Feed</div><div class="navitem"><b>⌁</b>Markets</div><div class="navitem"><b>☆</b>Watchlist</div><div class="navitem"><b>≡</b>More</div></nav>
</div>
<script>
const feed=document.getElementById("feed");
const marketNames={"^AXJO":["ASX 200","Australian equities"],"^GSPC":["S&P 500","US equities"],"^VIX":["VIX","US volatility"],"CL=F":["WTI Crude","Oil"],"GC=F":["Gold","Precious metals"],"AUDUSD=X":["AUD/USD","Australian dollar"],"^TNX":["US 10Y","Rates"],"BHP.AX":["BHP","Materials"],"CBA.AX":["CBA","Financials"],"RIO.AX":["Rio Tinto","Materials"],"FMG.AX":["Fortescue","Materials"],"WES.AX":["Wesfarmers","Consumer"],"CSL.AX":["CSL","Healthcare"],"NAB.AX":["NAB","Financials"],"WBC.AX":["Westpac","Financials"],"ANZ.AX":["ANZ","Financials"],"MQG.AX":["Macquarie","Financials"],"TLS.AX":["Telstra","Telecom"],"GMG.AX":["Goodman Group","Property"]};
const fallbackCards=[{tag:"MARKET MIND",time:"DEMO",title:"Live intelligence unavailable",dek:"Market Mind is using its built-in fallback cards while the live intelligence layer reconnects.",data:[["STATUS","Fallback"],["SOURCE","Market Mind"],["MODE","Safe"]],insight:"The live feed will resume automatically when the server-side market intelligence endpoint is available."}];
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pct(v){return Number.isFinite(v)?(v>=0?"+":"")+v.toFixed(2)+"%":"—";}
function price(v){return Number.isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:2}):"—";}
function scoreMarket(x){return Math.min(88,Math.round(45+Math.abs(x.pct||0)*15));}
function crossAssetCard(s){return {tag:"CROSS-ASSET / SIGNAL",time:"SIGNAL • "+s.score+"/100",title:s.title,dek:s.explanation||s.body||"Related market moves detected.",data:[["IMPORTANCE",s.score+"/100"],["SIGNAL","Cross-asset"],["STATUS","Detected"]],insight:s.watch||"Market Mind detected multiple related moves together. Treat this as a signal for investigation, not a standalone explanation.",source:"Market Mind • Derived signal",rank:s.score};}
function signalCard(s){return {tag:(s.type||"SIGNAL").replace("-"," / ").toUpperCase()+" / SIGNAL",time:"SIGNAL • "+(s.score||0)+"/100",title:s.title,dek:s.explanation||s.body||"Live market relationship detected.",data:[["IMPORTANCE",(s.score||0)+"/100"],["TYPE",s.type||"Signal"],["STATUS","Detected"]],insight:s.watch||s.framework?.implication||"Treat the signal as a prompt for investigation and confirm the underlying catalyst in current news.",source:"Market Mind • Intelligence layer",rank:s.score||0};}
function newsCard(item){return {tag:"NEWS / MARKET INTELLIGENCE",time:"NEWS",title:item.title,dek:(item.source||"Market source")+" • "+(item.pubDate?new Date(item.pubDate).toLocaleString([], {hour:"2-digit",minute:"2-digit",day:"2-digit",month:"short"}):"Latest"),data:[["SOURCE",item.source||"News"],["TYPE","Market news"],["STATUS","Latest"]],insight:"Read the headline in context: identify which asset, sector, rate or currency is directly exposed and whether the market has already reacted.",source:item.link?"Original article ↗":"Market Mind • News feed",link:item.link,rank:0};}
function miniChart(seed,direction){var pts=[],n=13;for(var i=0;i<n;i++){var y=45+Math.sin((i+seed)/2.2)*9+(i/(n-1))*(direction==="UP"?18:-18);pts.push([i,y]);}var d=pts.map(function(p,i){var x=18+i*(100/(n-1)),y=86-p[1];return(i?"L":"M")+x.toFixed(1)+","+y.toFixed(1);}).join(" ");var lx=93,ly=86-pts[n-1][1];return '<svg viewBox="0 0 100 86" preserveAspectRatio="none"><path class="mind-grid" d="M0 21H100M0 43H100M0 65H100"/><path class="mind-line" d="'+d+'"/><circle class="mind-dot" cx="'+lx+'" cy="'+ly+'" r="3"/></svg>';}
function renderCards(cards){feed.innerHTML=cards.map(function(c,i){return '<article class="card"><div class="topline"><div class="tag">'+esc(c.tag)+'</div><div class="timestamp">'+esc(c.time)+'</div></div><h1>'+esc(c.title)+'</h1><p class="dek">'+esc(c.dek)+'</p><div class="data">'+(c.data||[]).slice(0,4).map(function(d){return '<div class="box"><div class="label">'+esc(d[0])+'</div><div class="value">'+esc(d[1])+'</div></div>';}).join("")+'</div><div class="mind-reveal d1 signal-pill"><i></i>LIVE MARKET SIGNAL</div>'+(c.chart?'<div class="mind-chart mind-reveal d2">'+miniChart(c.rank||50,c.signal)+'</div>':'')+'<div class="insight mind-reveal d3"><small>The Mind</small><p>'+esc(c.insight)+'</p></div><div class="actions"><button class="action save" aria-label="Save">☆</button><button class="action share" aria-label="Share">↗</button>'+(c.link?'<button class="action open" aria-label="Open source">↗</button>':'<button class="action" aria-label="More">•••</button>')+'</div><div class="source"><span>'+esc(c.source||"Market Mind")+'</span><span>'+(i+1)+' / '+cards.length+'</span></div></article>';}).join("");
feed.querySelectorAll(".save").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();b.textContent=b.textContent==="☆"?"★":"☆";});});
feed.querySelectorAll(".share").forEach(function(b,i){b.addEventListener("click",function(e){e.stopPropagation();var c=cards[i];if(navigator.share)navigator.share({title:c.title,text:c.dek,url:c.link||location.href});});});
feed.querySelectorAll(".open").forEach(function(b,i){b.addEventListener("click",function(e){e.stopPropagation();if(cards[i].link)window.open(cards[i].link,"_blank","noopener,noreferrer");});});
feed.scrollTop=0;}
function setHealth(text,ok){var el=document.getElementById("status");if(!el){el=document.createElement("div");el.id="status";el.style.cssText="position:absolute;top:70px;left:18px;z-index:6;font-size:9px;letter-spacing:.7px;text-transform:uppercase;padding:5px 8px;border:1px solid var(--line);background:#081018;color:var(--muted)";document.querySelector(".app").appendChild(el);}el.textContent=(ok?"● LIVE ":"○ ")+text;el.style.color=ok?"var(--up)":"var(--down)";}
function setTicker(id,item){var el=document.getElementById(id);if(!el||!item)return;el.textContent=item.value||"—";el.className=item.direction==="down"?"down":item.direction==="up"?"up":"";}
async function loadLiveFeed(){
 try{
  const [marketRes,mindRes,newsRes]=await Promise.allSettled([fetch("/api/market?ts="+Date.now(),{cache:"no-store"}),fetch("/api/mind?ts="+Date.now(),{cache:"no-store"}),fetch("/api/news?q=ASX%20Australia%20markets%20OR%20US%20stocks%20OR%20RBA%20OR%20oil&ts="+Date.now(),{cache:"no-store"})]);
  const market=marketRes.status==="fulfilled"&&marketRes.value.ok?await marketRes.value.json():{data:[]};
  const mind=mindRes.status==="fulfilled"&&mindRes.value.ok?await mindRes.value.json():{signals:[]};
  const news=newsRes.status==="fulfilled"&&newsRes.value.ok?await newsRes.value.json():{items:[]};
  const marketData=(market.data||[]).filter(x=>x.ok&&Number.isFinite(x.pct));
  setTicker("asx",marketData.find(x=>x.symbol==="^AXJO")?{value:price(marketData.find(x=>x.symbol==="^AXJO").price)+" "+pct(marketData.find(x=>x.symbol==="^AXJO").pct),direction:marketData.find(x=>x.symbol==="^AXJO").pct>=0?"up":"down"}:null);
  setTicker("spx",marketData.find(x=>x.symbol==="^GSPC")?{value:price(marketData.find(x=>x.symbol==="^GSPC").price)+" "+pct(marketData.find(x=>x.symbol==="^GSPC").pct),direction:marketData.find(x=>x.symbol==="^GSPC").pct>=0?"up":"down"}:null);
  const signalCards=(mind.signals||[]).map(signalCard);
  const newsCards=(news.items||[]).slice(0,4).map(newsCard);
  const liveCards=signalCards.concat(newsCards);
  if(liveCards.length){renderCards(liveCards);setHealth("INTELLIGENCE • "+(mind.signalCount||signalCards.length)+" signals • Updated "+(mind.updatedAt||"now"),true);}
  else if((marketData||[]).length){renderCards(marketData.slice(0,8).sort(function(a,b){return scoreMarket(b)-scoreMarket(a);}).map(function(x){var meta=marketNames[x.symbol]||[x.symbol,"Market"];return {tag:"LIVE / "+meta[1].toUpperCase(),time:"LIVE • "+scoreMarket(x)+"/100",title:meta[0]+" is "+(x.pct>=0?"higher":"lower"),dek:meta[0]+" is "+price(x.price)+", "+pct(x.pct)+" on the session.",data:[[meta[0],price(x.price)],["SESSION",pct(x.pct)],["IMPORTANCE",scoreMarket(x)+"/100"]],insight:"The useful question is whether this move is broad-based or driven by one specific catalyst. Compare related assets and current news.",source:"Market Mind • Live market data",rank:scoreMarket(x),chart:true,signal:x.pct>=0?"UP":"DOWN"};}));setHealth("LIVE MARKET DATA • Updated "+(market.updatedAt||"now"),true);}
  else {renderCards(fallbackCards);setHealth("Live feed unavailable",false);}
 }catch(err){console.warn("Market Mind live feed unavailable",err);renderCards(fallbackCards);setHealth("Live feed unavailable",false);}
}
renderCards(fallbackCards);setHealth("Starting live intelligence…",false);loadLiveFeed();setInterval(loadLiveFeed,60000);
feed.addEventListener("scroll",function(){var max=feed.scrollHeight-feed.clientHeight;document.getElementById("progress").style.height=Math.max(8,Math.min(100,(feed.scrollTop/max)*75+25))+"%";});
</script>
</body>
</html>
